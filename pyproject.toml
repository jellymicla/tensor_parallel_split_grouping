[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jellymicla-tensor_parallel_split_grouping"
version = "0.1.0"
description = "按结构键把条目聚类，标出GPU 集群运维工程师·张量并行切分策略上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jellymicla" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jellymicla.github.io"
Repository = "https://github.com/jellymicla/tensor_parallel_split_grouping"
Issues = "https://github.com/jellymicla/tensor_parallel_split_grouping/issues"

[project.scripts]
tensor_parallel_split_grouping = "tensor_parallel_split_grouping:main"

[tool.setuptools]
py-modules = ["tensor_parallel_split_grouping"]
